name: Generate Pollinations Images

on:
  workflow_dispatch: # Actions ටැබ් එකෙන් manual Run කිරීමට ඉඩ ලබාදෙයි

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repository එකට පින්තූර Push කිරීමට අවසර ලබාදීම

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run image generation script
        run: python main.py

      - name: Commit and Push generated images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "Add 50 generated images via Pollinations AI" || echo "No changes to commit"
          git push
